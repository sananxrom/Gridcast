<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridcast — Sign in</title><link rel="stylesheet" href="/assets/app.css">
<style>
body{display:grid;place-items:center;background:var(--nav)}
.auth{width:min(420px,92vw);background:var(--surface);border-radius:10px;padding:30px 30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth h1{font-size:20px;margin:0 0 4px}
.auth p.sub{margin:0 0 20px}
.who{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.who button{display:flex;align-items:center;gap:11px;text-align:left;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:var(--r);padding:10px 12px;cursor:pointer;font:inherit;width:100%}
.who button:hover{border-color:var(--brand);background:var(--brand-soft)}
.av{width:30px;height:30px;border-radius:5px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who .n{font-weight:600;font-size:13.5px}.who .r{font-size:11.5px;color:var(--ink-3)}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:22px}
.sep{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 14px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--rule)}
</style></head><body>
<div class="auth">
  <div class="mark"><span class="dot"></span> Gridcast</div>
  <h1>Sign in</h1><p class="sub">Prototype — pick an account to continue.</p>
  <div class="who" id="who"></div>
  <div class="sep">or</div>
  <a class="btn ghost" style="width:100%;justify-content:center" href="/player.html">Open a screen player →</a>
</div>
<script type="module">
import { api, session, esc } from '/assets/app.js';
const dest = { platform_admin:'/admin.html', org_admin:'/operator.html', advertiser_viewer:'/advertiser.html' };
const roleName = { platform_admin:'Platform admin', org_admin:'Operator', advertiser_viewer:'Advertiser' };
const users = await api('/users');
document.getElementById('who').innerHTML = users.map(u => `
  <button data-id="${u.id}">
    <span class="av">${esc(u.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>
    <span><span class="n">${esc(u.name)}</span><br><span class="r">${roleName[u.role]} · ${esc(u.org)}</span></span>
  </button>`).join('');
document.getElementById('who').onclick = (e) => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const u = users.find(x => x.id === b.dataset.id);
  session.set({ id:u.id, name:u.name, role:u.role, orgName:u.org, org_id:u.org_id, advertiser_id:u.advertiser_id });
  location.href = dest[u.role];
};
</script></body></html>
